<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Moondiver Mastering Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    /* Custom Scrollbar for console */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
  </style>
</head>
<body class="bg-[#0b1120] text-gray-100 min-h-screen p-8 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] bg-fixed" x-data="studioApp()">

  <div class="max-w-5xl mx-auto relative z-10">
    <header class="mb-12 flex flex-col md:flex-row items-center justify-between gap-6">
      <div class="text-center md:text-left">
        <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 pb-2">
          Moondiver Mastering Studio
        </h1>
        <p class="text-gray-400 mt-2 text-lg font-light tracking-wide">Automated Stem Mixing, Mastering & Album Sequencing</p>
      </div>

      <div class="bg-gray-800/80 backdrop-blur border border-gray-700/50 rounded-lg px-5 py-3 flex items-center gap-6 shrink-0 shadow-xl">
        <!-- CPU Gauge -->
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
          <div class="flex flex-col items-start">
            <span class="text-[10px] uppercase tracking-wider text-gray-500 font-bold">CPU Load</span>
            <div class="flex items-center gap-2">
              <div class="w-16 h-1.5 bg-gray-700 rounded-full overflow-hidden">
                <div class="h-full transition-all duration-500" :class="cpu > 80 ? 'bg-red-500' : (cpu > 50 ? 'bg-yellow-500' : 'bg-green-500')" :style="`width: ${cpu}%`"></div>
              </div>
              <span class="text-sm font-mono font-bold text-gray-300 w-8" x-text="`${cpu}%`"></span>
            </div>
          </div>
        </div>
        <!-- GPU Gauge -->
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
          <div class="flex flex-col items-start">
            <span class="text-[10px] uppercase tracking-wider text-gray-500 font-bold">RTX 5060</span>
            <div class="flex items-center gap-2">
              <div class="w-16 h-1.5 bg-gray-700 rounded-full overflow-hidden">
                <div class="h-full transition-all duration-500" :class="gpu > 80 ? 'bg-red-500' : (gpu > 50 ? 'bg-yellow-500' : 'bg-cyan-500')" :style="`width: ${gpu}%`"></div>
              </div>
              <span class="text-sm font-mono font-bold text-gray-300 w-8" x-text="`${gpu}%`"></span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- Panel: Configuration -->
      <div class="bg-gray-800/60 backdrop-blur-md rounded-2xl p-6 shadow-2xl border border-gray-700/50">
        <h2 class="text-xl font-semibold mb-6 text-white border-b border-gray-700/50 pb-3 flex items-center gap-2">
          <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Configuration
        </h2>
        
        <div class="mb-6">
          <div class="flex justify-between items-end mb-2">
            <label class="block text-sm font-medium text-gray-300">Absolute Folder Path</label>
            <button @click="openExplorer()" class="text-xs text-cyan-400 hover:text-cyan-300 flex items-center gap-1 bg-cyan-900/30 px-2 py-1 rounded border border-cyan-800/50 transition">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
              Open in Explorer
            </button>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z" />
              </svg>
            </div>
            <textarea x-model="targetPath" rows="2" class="w-full bg-[#111827] border border-gray-600 rounded-lg py-2 pl-10 pr-3 text-cyan-300 font-mono text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-shadow resize-none" placeholder="z.B. E:\Music Projects\Frozen Time"></textarea>
          </div>
          <p class="text-xs text-gray-500 mt-2">Path to .wav file (for Split) or folder (for Mix/Master).</p>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-300 mb-3">Genre Preset / DSP Profile</label>
          <div class="grid grid-cols-2 gap-3 max-h-[300px] overflow-y-auto pr-2 pb-2">
            <template x-for="[key, p] in Object.entries(presets)" :key="key">
              <button 
                @click="selectedPreset = key"
                :class="selectedPreset === key ? 'bg-gradient-to-br from-cyan-900/80 to-blue-900/80 border-cyan-400 text-white shadow-[0_0_15px_rgba(34,211,238,0.15)] scale-[1.02]' : 'bg-[#111827] border-gray-700/80 hover:border-gray-500 hover:bg-gray-800 text-gray-400'"
                class="flex flex-col items-center justify-center p-3 rounded-xl border transition-all text-center gap-2">
                <div class="w-6 h-6 transition-colors" :class="selectedPreset === key ? 'text-cyan-300' : 'text-gray-500'" x-html="getIcon(key)"></div>
                <span class="text-xs font-semibold leading-tight" x-text="p.name"></span>
              </button>
            </template>
          </div>
        </div>
      </div>

      <!-- Panel: Actions Pipeline -->
      <div class="bg-gray-800/60 backdrop-blur-md rounded-2xl p-6 shadow-2xl border border-gray-700/50">
        <h2 class="text-xl font-semibold mb-6 text-white border-b border-gray-700/50 pb-3 flex items-center gap-2">
          <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Mastering Pipeline
        </h2>
        
        <div class="relative space-y-0 pl-4">
          <!-- Flow Line -->
          <div class="absolute left-[31px] top-6 bottom-8 w-0.5 bg-gray-700/50 z-0"></div>

          <!-- Step 1 -->
          <div class="relative z-10 flex flex-col gap-2 pb-6">
            <button @click="runSplit()" :disabled="loading" class="group relative w-full flex justify-between items-center py-3.5 px-5 border border-purple-500/30 rounded-lg shadow-md text-sm font-bold text-white bg-gradient-to-r from-gray-800 to-gray-800 hover:from-purple-900/40 hover:to-fuchsia-900/40 disabled:opacity-50 transition-all overflow-hidden">
              <span class="flex items-center gap-3">
                <span class="flex items-center justify-center w-7 h-7 rounded-full bg-purple-500/20 text-purple-400 border border-purple-500/50 text-xs">1</span>
                AI Stem Split (Demucs)
              </span>
              <svg class="w-4 h-4 text-purple-400 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </button>
          </div>

          <!-- Step 2 -->
          <div class="relative z-10 flex flex-col gap-2 pb-6">
            <button @click="runMix()" :disabled="loading" class="group relative w-full flex justify-between items-center py-3.5 px-5 border border-cyan-500/30 rounded-lg shadow-md text-sm font-bold text-white bg-gradient-to-r from-gray-800 to-gray-800 hover:from-cyan-900/40 hover:to-blue-900/40 disabled:opacity-50 transition-all overflow-hidden">
              <span class="flex items-center gap-3">
                <span class="flex items-center justify-center w-7 h-7 rounded-full bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 text-xs">2</span>
                Auto-Mix Stems
              </span>
              <svg class="w-4 h-4 text-cyan-400 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            </button>
          </div>

          <!-- Step 3 -->
          <div class="relative z-10 flex flex-col gap-2 pb-6">
            <button @click="runMaster()" :disabled="loading" class="group relative w-full flex justify-between items-center py-3.5 px-5 border border-emerald-500/30 rounded-lg shadow-md text-sm font-bold text-white bg-gradient-to-r from-gray-800 to-gray-800 hover:from-emerald-900/40 hover:to-teal-900/40 disabled:opacity-50 transition-all overflow-hidden">
              <span class="flex items-center gap-3">
                <span class="flex items-center justify-center w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 text-xs">3</span>
                Finales Mastering (-16 LUFS)
              </span>
              <svg class="w-4 h-4 text-emerald-400 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            </button>
          </div>

          <!-- Step 4 -->
          <div class="relative z-10 flex flex-col gap-2">
            <button @click="runSequence()" :disabled="loading" class="group relative w-full flex justify-between items-center py-3.5 px-5 border border-gray-500/30 rounded-lg shadow-md text-sm font-bold text-gray-300 bg-gray-800/80 hover:bg-gray-700/80 disabled:opacity-50 transition-all overflow-hidden">
              <span class="flex items-center gap-3">
                <span class="flex items-center justify-center w-7 h-7 rounded-full bg-gray-500/20 text-gray-400 border border-gray-500/50 text-xs">4</span>
                Sequence Album & Tags
              </span>
              <svg class="w-4 h-4 text-gray-400 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Status & Output Console -->
    <div class="mt-8 bg-[#050810] rounded-2xl p-5 shadow-inner border border-gray-800/80 h-72 overflow-y-auto font-mono text-sm relative">
      <div class="absolute top-4 right-4 flex space-x-1">
        <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
        <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
      </div>
      
      <div x-show="loading" class="text-cyan-400 mb-3 flex items-center font-bold">
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-cyan-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        Processing audio... Please wait.
      </div>
      <template x-for="(log, i) in consoleLogs" :key="i">
        <div class="mb-1.5 leading-relaxed" :class="log.type === 'error' ? 'text-red-400' : (log.type === 'success' ? 'text-emerald-400' : 'text-gray-300')" x-html="log.msg"></div>
      </template>
    </div>

  </div>

  <script>
    function studioApp() {
      return {
        targetPath: 'E:\\Music Projects\\Frozen Time\\suno_exports\\Drifting.wav',
        presets: {},
        selectedPreset: 'new_age_ambient',
        loading: false,
        cpu: 0,
        gpu: 0,
        consoleLogs: [{type: 'system', msg: '> Moondiver DSP Engine ready.'}],

        async init() {
          // Preset Fetch
          try {
            const res = await fetch('/api/presets');
            this.presets = await res.json();
          } catch(e) {
            this.log('Error loading presets', 'error');
          }
          
          // CPU/GPU Polling loop
          setInterval(async () => {
            try {
              const res = await fetch('/api/system-stats');
              const data = await res.json();
              this.cpu = data.cpu;
              this.gpu = data.gpu;
            } catch(e) {}
          }, 1500);
        },

        log(msg, type='info') {
          const timestamp = new Date().toLocaleTimeString();
          let formatted = msg;
          if (typeof msg === 'object') {
            formatted = `<pre class="mt-2 text-gray-400 bg-gray-900/50 p-2 rounded border border-gray-800">${JSON.stringify(msg, null, 2)}</pre>`;
          }
          this.consoleLogs.push({type, msg: `<span class="text-gray-500">[${timestamp}]</span> ${formatted}`});
          // scroll to bottom
          setTimeout(() => {
            const container = document.querySelector('.overflow-y-auto');
            container.scrollTop = container.scrollHeight;
          }, 50);
        },

        async runAction(endpoint, payload) {
          if (!this.targetPath) {
            this.log('Error: Please enter a path.', 'error');
            return;
          }
          
          this.loading = true;
          this.log(`🚀 Starting task on ${endpoint}...`);
          
          try {
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            if (!res.ok) throw new Error(data.error || 'Server Fehler');
            
            this.log(`✅ Success!`, 'success');
            this.log(data);
          } catch (e) {
            this.log(`❌ Error: ${e.message}`, 'error');
          } finally {
            this.loading = false;
          }
        },

        openExplorer() {
          let folder = this.targetPath;
          // If it ends in .wav or .mp3, get the directory
          if (folder.toLowerCase().endsWith('.wav') || folder.toLowerCase().endsWith('.mp3')) {
            folder = folder.substring(0, folder.lastIndexOf('\\'));
          }
          if (folder) {
            fetch('/api/open-explorer', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ targetFolder: folder })
            });
            this.log(`Opening Windows Explorer: ${folder}`);
          }
        },

        runSplit() {
          this.runAction('/api/split', { targetFile: this.targetPath });
        },

        runMix() {
          this.runAction('/api/mix', { targetFolder: this.targetPath, preset: this.selectedPreset });
        },

        runMaster() {
          this.runAction('/api/master', { targetPath: this.targetPath, preset: this.selectedPreset });
        },

        runSequence() {
          this.runAction('/api/sequence', { targetPath: this.targetPath, applyRenumbering: true });
        },

        getIcon(key) {
          const icons = {
            'auto': '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>',
            'new_age_ambient': '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>',
            'cinematic_orchestral': '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>',
            'acoustic_instrumental': '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>',
            'meditation_chillout': '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>',
            'streaming_pop_standard': '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>',
            'stadium_live_rock': '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>',
            'custom': '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>'
          };
          return icons[key] || icons['custom'];
        }
      }
    }
  </script>
</body>
</html>
