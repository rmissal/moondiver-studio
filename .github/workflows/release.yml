name: Release Pipeline

on:
  push:
    tags:
      - 'v*' # Triggers on tags starting with v (e.g., v1.0.0, v2.1.3)

permissions:
  contents: write # Required to create GitHub Releases

jobs:
  validate-and-release:
    name: Validate, Package, and Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for changelog generation

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧹 Run Linter
        run: npm run lint

      - name: 🧪 Run Tests
        run: npm test

      - name: 📁 Prepare Production Archive
        run: |
          # Create a clean release folder without dev tools and git history
          mkdir release_build
          rsync -a --exclude={'.git','.github','node_modules','test','.gitignore','.prettierignore','.prettierrc','eslint.config.mjs','release_build'} ./ release_build/
          
          # Create zip archive
          cd release_build
          zip -r ../moondiver-studio-${{ github.ref_name }}.zip ./*
          cd ..

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Moondiver Studio ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            moondiver-studio-${{ github.ref_name }}.zip